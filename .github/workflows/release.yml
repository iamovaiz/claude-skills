name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_skills.py
      - name: Zip each skill for upload to Claude apps
        run: |
          mkdir dist
          for d in skills/*/; do
            n=$(basename "$d")
            cp LICENSE NOTICE "$d"
            (cd skills && zip -qr "../dist/$n.zip" "$n" -x "*/__pycache__/*")
          done
          ls -la dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
